[pytest]
testpaths = tests

# Put the repository root on sys.path, so `import app` works however the
# suite is started. `python -m pytest` adds the current directory on its
# own; plain `pytest` — what CI and the README use — does not, and
# conftest.py failed to import with exit code 4 (defect 22).
pythonpath = .
asyncio_mode = auto

# Keep the H3 evidence readable: one line per endpoint, with the module and
# the route in the test id.
addopts = -q --strict-markers --tb=short

markers =
    integration: needs a live Supabase project and two test accounts
